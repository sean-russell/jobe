# HAProxy in front of one or more Jobe servers.
#
# Jobe can run at most jobe_max_users (default 16) jobs at once; beyond that it
# makes requests wait up to jobe_wait_timeout (10 s) and then reports "server
# overload". Here HAProxy only lets JOBE_SLOTS run requests through to each Jobe
# server at a time and holds the rest in a first-come-first-served queue, for up
# to QUEUE_TIMEOUT. Jobe itself therefore never reaches its overload point.
#
# If a request has waited QUEUE_TIMEOUT, or the queue already holds QUEUE_MAX
# requests, the client gets Jobe's normal "server overload" result (outcome 21),
# so CodeRunner shows its usual "server overload, try again shortly" message.
#
# Settings come from environment variables (see docker-compose.yml).

global
    maxconn 4096
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  300s
    # Longest a single Jobe request may take (cputime upper limit is 120 s, and
    # Jobe kills a job at twice its cputime).
    timeout server  300s
    timeout queue   "${QUEUE_TIMEOUT}"

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend jobe
    bind :80
    # Runs (POST .../runs) go through the queue; everything else (language list,
    # file uploads/checks) is cheap, uses no Jobe worker, and bypasses it.
    acl is_run method POST
    acl is_run_path path_end /runs
    acl queue_full queue(jobe_runs) ge "${QUEUE_MAX}"
    http-request return status 200 content-type "application/json; charset=utf-8" file /etc/haproxy/overload.json if is_run is_run_path queue_full
    use_backend jobe_runs if is_run is_run_path
    default_backend jobe_other

backend jobe_runs
    # Send each run to the Jobe server with the fewest runs in progress.
    balance leastconn
    option httpchk GET /jobe/index.php/restapi/languages
    http-check expect status 200
    # Queue timeout or no healthy server -> Jobe-style overload result, not a bare 503.
    errorfile 503 /etc/haproxy/overload.http
    # One entry per Jobe container (docker compose --scale jobe-worker=N), found via
    # Docker's DNS. maxconn = how many runs each Jobe may have at once.
    server-template worker 1-8 jobe-worker:80 check inter 3s rise 1 resolvers docker init-addr libc,none maxconn "${JOBE_SLOTS}"

backend jobe_other
    balance roundrobin
    option httpchk GET /jobe/index.php/restapi/languages
    http-check expect status 200
    server-template worker 1-8 jobe-worker:80 check inter 3s rise 1 resolvers docker init-addr libc,none

# Live statistics page: http://localhost:8404/  (queue length, runs in progress,
# per-server state). Shows "worker1..8"; only those backed by a container are UP.
listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
